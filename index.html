<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CIP — Autorizar acesso</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b0f14; color:#eef2f6; }
    main { width:min(440px,calc(100% - 32px)); padding:32px; border:1px solid #263241; border-radius:18px; background:#121820; box-shadow:0 20px 60px #0008; }
    h1 { margin:0 0 8px; font-size:28px; }
    p { color:#b9c4d0; line-height:1.5; }
    input,button { width:100%; box-sizing:border-box; padding:13px 14px; margin-top:12px; border-radius:10px; font:inherit; }
    input { border:1px solid #344152; background:#0b1017; color:#fff; }
    button { border:0; cursor:pointer; font-weight:700; background:#2e7df6; color:#fff; }
    button.secondary { background:#263241; }
    .error { color:#ff9b9b; }
    [hidden] { display:none!important; }
  </style>
</head>
<body>
<main>
  <h1>Acesso ao CIP</h1>
  <p id="message">Carregando autorização…</p>
  <form id="login" hidden>
    <input id="email" type="email" required autocomplete="username" placeholder="E-mail">
    <input id="password" type="password" required autocomplete="current-password" placeholder="Senha">
    <button type="submit">Entrar</button>
  </form>
  <form id="mfa" hidden>
    <input id="totp" type="text" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="Código do autenticador">
    <button type="submit">Confirmar segundo fator</button>
  </form>
  <div id="consent" hidden>
    <button id="approve">Autorizar acesso somente leitura</button>
    <button id="deny" class="secondary">Recusar</button>
  </div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.79.0?pin=v135';
const supabaseUrl = 'https://wbsqdzrxalfddvmjvlbh.supabase.co';
const publishableKey = 'sb_publishable_yxp8wXBhjOs2ajf3Dgtg_w_sW43vdPn';
const supabase = createClient(supabaseUrl, publishableKey, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
let accessToken = null;
const authorizationId = new URLSearchParams(location.search).get('authorization_id');
const message = document.querySelector('#message');
const login = document.querySelector('#login');
const mfa = document.querySelector('#mfa');
const consent = document.querySelector('#consent');

function showError(text) {
  message.textContent = text;
  message.className = 'error';
}

function getAccessToken() {
  return accessToken;
}

async function oauthRequest(path, options = {}) {
  const accessToken = getAccessToken();
  if (!accessToken) return { response: null, data: null };
  const response = await fetch(`${supabaseUrl}/auth/v1${path}`, {
    ...options,
    headers: {
      apikey: publishableKey,
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.msg || data.message || data.error_description || 'Falha na autorização.');
  return { response, data };
}

async function load() {
  message.className = '';
  if (!authorizationId) return showError('Solicitação OAuth ausente. Volte ao ChatGPT e clique em Conectar novamente.');
  if (!getAccessToken()) {
    message.textContent = 'Entre com o usuário autorizado do CIP.';
    login.hidden = false;
    return;
  }
  let data;
  try {
    ({ data } = await oauthRequest(`/oauth/authorizations/${encodeURIComponent(authorizationId)}`));
  } catch (error) {
    accessToken = null;
    return showError(error.message);
  }
  if (data?.redirect_url && !data?.authorization_id) {
    location.href = data.redirect_url;
    return;
  }
  message.textContent = 'O ChatGPT solicita acesso somente leitura aos dados do QuickBooks do CIP.';
  consent.hidden = false;
}

async function requireMfaIfNeeded() {
  const { data: assurance, error: assuranceError } = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
  if (assuranceError) throw assuranceError;
  if (assurance?.nextLevel === 'aal2' && assurance.currentLevel !== 'aal2') {
    message.textContent = 'Digite o código de seis dígitos do seu aplicativo autenticador.';
    mfa.hidden = false;
    return true;
  }
  return false;
}

login.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = 'Validando…';
  const { data, error } = await supabase.auth.signInWithPassword({
    email: document.querySelector('#email').value,
    password: document.querySelector('#password').value
  });
  if (error || !data.session) return showError(error?.message || 'Não foi possível entrar.');
  accessToken = data.session.access_token;
  login.hidden = true;
  try {
    if (await requireMfaIfNeeded()) return;
  } catch (error) { return showError(error.message); }
  await load();
});

mfa.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = 'Validando o segundo fator…';
  try {
    const { data: factors, error: factorsError } = await supabase.auth.mfa.listFactors();
    if (factorsError) throw factorsError;
    const factor = factors?.totp?.find(item => item.status === 'verified');
    if (!factor) return showError('Nenhum autenticador TOTP verificado está disponível para esta conta.');
    const { error: verifyError } = await supabase.auth.mfa.challengeAndVerify({
      factorId: factor.id,
      code: document.querySelector('#totp').value
    });
    if (verifyError) throw verifyError;
    const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
    if (sessionError || !sessionData.session) throw sessionError || new Error('Sessão MFA ausente.');
    accessToken = sessionData.session.access_token;
    mfa.hidden = true;
    await load();
  } catch (error) { showError(error.message || 'Não foi possível validar o segundo fator.'); }
});

document.querySelector('#approve').addEventListener('click', async () => {
  try {
    const { data } = await oauthRequest(`/oauth/authorizations/${encodeURIComponent(authorizationId)}/consent`, {
      method: 'POST', body: JSON.stringify({ action: 'approve' })
    });
    location.href = data.redirect_url;
  } catch (error) { showError(error.message); }
});

document.querySelector('#deny').addEventListener('click', async () => {
  try {
    const { data } = await oauthRequest(`/oauth/authorizations/${encodeURIComponent(authorizationId)}/consent`, {
      method: 'POST', body: JSON.stringify({ action: 'deny' })
    });
    location.href = data.redirect_url;
  } catch (error) { showError(error.message); }
});

await load();
</script>
</body>
</html>
